# ======================================
# RED404 - Blood Donation System
# Spring Boot Application Properties
# ======================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# MySQL DataSource Configuration
# Auto-detects cloud environments (Railway, Render) or falls back to local XAMPP on 127.0.0.1:3307
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:127.0.0.1}:${MYSQLPORT:3307}/${MYSQLDATABASE:red404}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=-1

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=RED404_SESSION
server.servlet.session.cookie.http-only=true

# Schema initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# Logging
logging.level.com.red404=DEBUG
logging.level.org.springframework.web=INFO

