<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RED404 - 404 Page Not Found. The requested resource could not be located." />
  <title>404 Page Not Found — RED404</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090a0f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .error-card {
      background: #11141c;
      border: 1px solid #1e2433;
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(230, 57, 70, 0.15);
      color: #e63946;
      border: 1px solid rgba(230, 57, 70, 0.3);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
      color: #e63946;
      margin-bottom: 12px;
      letter-spacing: -0.03em;
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-direction: column;
    }
    @media (min-width: 440px) {
      .actions { flex-direction: row; justify-content: center; }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: #e63946;
      color: #ffffff;
      border: 1px solid #e63946;
    }
    .btn-primary:hover {
      background: #d62839;
    }
    .btn-secondary {
      background: #1e2433;
      color: #cbd5e1;
      border: 1px solid #2d3748;
    }
    .btn-secondary:hover {
      background: #283347;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="badge">HTTP 404</div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page or resource you are looking for does not exist or has been moved within RED404 Emergency Network.</p>
    <div class="actions">
      <a href="/index.html" class="btn btn-primary">Back to Home</a>
      <a href="/blood-availability-search.html" class="btn btn-secondary">Search Donors</a>
    </div>
  </div>
</body>
</html>
