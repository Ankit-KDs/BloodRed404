<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141e"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
    <filter id="cardShadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="360" height="280" rx="16" fill="url(#bgGrad5)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#cardShadow5)"/>

  <!-- Camp Calendar & Community Event Badge -->
  <g transform="translate(130, 48)">
    <rect width="140" height="150" rx="12" fill="#181824" stroke="rgba(230,57,70,0.35)" stroke-width="1.5"/>
    <!-- Calendar Top Bar -->
    <path d="M0 12 C0 5.4 5.4 0 12 0 L128 0 C134.6 0 140 5.4 140 12 L140 38 L0 38 Z" fill="#e63946"/>
    <!-- Calendar Rings -->
    <rect x="30" y="-4" width="8" height="12" rx="2" fill="#ffffff"/>
    <rect x="102" y="-4" width="8" height="12" rx="2" fill="#ffffff"/>
    <text x="70" y="24" fill="#ffffff" font-family="'Orbitron', monospace" font-size="11" font-weight="800" text-anchor="middle">CITY BLOOD DRIVE</text>

    <!-- Center Blood Droplet with Heart Inside -->
    <path d="M70 56 C70 56 46 86 46 104 C46 117.2 56.8 128 70 128 C83.2 128 94 117.2 94 104 C94 86 70 56 70 56 Z" fill="url(#heartGrad)"/>
    <path d="M70 94 C67 88 58 88 58 96 C58 104 70 114 70 114 C70 114 82 104 82 96 C82 88 73 88 70 94 Z" fill="#ffffff"/>
  </g>

  <!-- Community Participants Floating Avatars -->
  <!-- Left volunteer -->
  <g transform="translate(50, 110)">
    <circle cx="28" cy="28" r="22" fill="#1c1c28" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>
    <circle cx="28" cy="23" r="7" fill="#10b981"/>
    <path d="M16 41 C16 35 22 35 28 35 C34 35 40 35 40 41 Z" fill="#10b981"/>
    <rect x="8" y="55" width="40" height="16" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
    <text x="28" y="66" fill="#10b981" font-family="'Inter', sans-serif" font-size="8" font-weight="700" text-anchor="middle">Volunteer</text>
  </g>

  <!-- Right donor -->
  <g transform="translate(300, 110)">
    <circle cx="28" cy="28" r="22" fill="#1c1c28" stroke="rgba(230,57,70,0.3)" stroke-width="1.2"/>
    <circle cx="28" cy="23" r="7" fill="#ff6b6b"/>
    <path d="M16 41 C16 35 22 35 28 35 C34 35 40 35 40 41 Z" fill="#ff6b6b"/>
    <rect x="8" y="55" width="40" height="16" rx="4" fill="rgba(230,57,70,0.15)" stroke="#e63946" stroke-width="0.8"/>
    <text x="28" y="66" fill="#ff6b6b" font-family="'Inter', sans-serif" font-size="8" font-weight="700" text-anchor="middle">Camp Donor</text>
  </g>

  <!-- Event Info Pill -->
  <g transform="translate(90, 215)">
    <rect width="220" height="32" rx="8" fill="#181824" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="110" y="20" fill="#f0f0f8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">📅 City Hall &amp; Trauma Depots • Open to All</text>
  </g>

  <!-- Bottom Tag -->
  <rect x="110" y="266" width="180" height="22" rx="11" fill="rgba(230,57,70,0.12)" stroke="rgba(230,57,70,0.3)"/>
  <text x="200" y="281" fill="#ff6b6b" font-family="'Orbitron', monospace" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle">COMMUNITY MEGA DRIVES</text>
</svg>

