<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141e"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222232"/>
      <stop offset="100%" stop-color="#161622"/>
    </linearGradient>
    <filter id="cardShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="360" height="280" rx="16" fill="url(#bgGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#cardShadow3)"/>

  <!-- Medical Clipboard Base -->
  <rect x="110" y="55" width="180" height="200" rx="12" fill="url(#clipGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Clipboard Metal Top Clamp -->
  <rect x="155" y="45" width="90" height="22" rx="6" fill="#303045" stroke="#e63946" stroke-width="1.2"/>
  <circle cx="200" cy="56" r="4" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Inner Paper Screen -->
  <rect x="125" y="80" width="150" height="160" rx="8" fill="#12121a" stroke="rgba(255,255,255,0.06)"/>

  <!-- Vitals Heartbeat / ECG Wave Line -->
  <path d="M135 110 L165 110 L172 95 L180 125 L188 100 L195 115 L200 110 L265 110" fill="none" stroke="#e63946" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Checklist Rows -->
  <!-- Item 1: Age Check -->
  <circle cx="148" cy="138" r="7" fill="#10b981"/>
  <path d="M145 138 L147 140 L152 135" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="162" y="133" width="95" height="9" rx="3" fill="rgba(255,255,255,0.25)"/>

  <!-- Item 2: Weight Check -->
  <circle cx="148" cy="162" r="7" fill="#10b981"/>
  <path d="M145 162 L147 164 L152 159" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="162" y="157" width="80" height="9" rx="3" fill="rgba(255,255,255,0.25)"/>

  <!-- Item 3: Interval Check -->
  <circle cx="148" cy="186" r="7" fill="#10b981"/>
  <path d="M145 186 L147 188 L152 183" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="162" y="181" width="88" height="9" rx="3" fill="rgba(255,255,255,0.25)"/>

  <!-- Approved Stamp / Badge -->
  <rect x="145" y="206" width="110" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2"/>
  <text x="200" y="221" fill="#10b981" font-family="'Orbitron', monospace" font-size="9" font-weight="800" text-anchor="middle">STATUS: ELIGIBLE</text>

  <!-- Stethoscope / Medical Icon floating left -->
  <g transform="translate(42, 105)">
    <circle cx="28" cy="28" r="24" fill="#1c1c28" stroke="rgba(230,57,70,0.4)" stroke-width="1.2"/>
    <path d="M22 18 C22 28 34 28 34 18" fill="none" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M28 28 L28 36" fill="none" stroke="#ff6b6b" stroke-width="2.2"/>
    <circle cx="28" cy="38" r="4" fill="#e63946"/>
  </g>

  <!-- Shield floating right -->
  <g transform="translate(305, 105)">
    <circle cx="28" cy="28" r="24" fill="#1c1c28" stroke="rgba(16,185,129,0.4)" stroke-width="1.2"/>
    <path d="M28 16 L38 20 C38 30 28 36 28 36 C28 36 18 30 18 20 Z" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.8"/>
  </g>

  <!-- Bottom Tag -->
  <rect x="110" y="266" width="180" height="22" rx="11" fill="rgba(230,57,70,0.12)" stroke="rgba(230,57,70,0.3)"/>
  <text x="200" y="281" fill="#ff6b6b" font-family="'Orbitron', monospace" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle">WHO CLINICAL CRITERIA</text>
</svg>
