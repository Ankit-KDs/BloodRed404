<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141e"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9b111e"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="360" height="280" rx="16" fill="url(#bgGrad1)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Radar Grid Circles (Static) -->
  <circle cx="200" cy="160" r="110" fill="none" stroke="rgba(230, 57, 70, 0.15)" stroke-width="1.5"/>
  <circle cx="200" cy="160" r="75" fill="none" stroke="rgba(230, 57, 70, 0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="200" cy="160" r="40" fill="rgba(230, 57, 70, 0.05)" stroke="rgba(230, 57, 70, 0.3)" stroke-width="1.5"/>

  <!-- Crosshairs -->
  <line x1="90" y1="160" x2="310" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="200" y1="50" x2="200" y2="270" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Proximity Donor Nodes -->
  <!-- Node 1 -->
  <circle cx="150" cy="115" r="7" fill="#e63946"/>
  <circle cx="150" cy="115" r="12" fill="none" stroke="#e63946" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="110" y="88" width="46" height="18" rx="4" fill="#1b1b26" stroke="rgba(255,255,255,0.1)"/>
  <text x="133" y="101" fill="#ff6b6b" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">A+ • 2km</text>

  <!-- Node 2 -->
  <circle cx="265" cy="130" r="6" fill="#e63946"/>
  <circle cx="265" cy="130" r="10" fill="none" stroke="#e63946" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="250" y="145" width="48" height="18" rx="4" fill="#1b1b26" stroke="rgba(255,255,255,0.1)"/>
  <text x="274" y="158" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">O+ • 4km</text>

  <!-- Node 3 -->
  <circle cx="160" cy="210" r="6" fill="#e63946"/>
  <circle cx="160" cy="210" r="10" fill="none" stroke="#e63946" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="135" y="224" width="48" height="18" rx="4" fill="#1b1b26" stroke="rgba(255,255,255,0.1)"/>
  <text x="159" y="237" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">B+ • 5km</text>

  <!-- Central Location Pin with Blood Droplet -->
  <g transform="translate(182, 126)">
    <path d="M18 0 C8 0 0 8 0 18 C0 29 18 46 18 46 C18 46 36 29 36 18 C36 8 28 0 18 0 Z" fill="url(#pinGrad)"/>
    <!-- Droplet inside pin -->
    <path d="M18 10 C18 10 12 18 12 22 C12 25.3 14.7 28 18 28 C21.3 28 24 25.3 24 22 C24 18 18 10 18 10 Z" fill="#ffffff"/>
  </g>

  <!-- Footer Tag inside card -->
  <rect x="120" y="266" width="160" height="22" rx="11" fill="rgba(230,57,70,0.12)" stroke="rgba(230,57,70,0.3)"/>
  <text x="200" y="281" fill="#ff6b6b" font-family="'Orbitron', monospace" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle">HAVERSINE RADAR ACTIVE</text>
</svg>
