<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141e"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>
    <linearGradient id="bldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a3c"/>
      <stop offset="100%" stop-color="#181824"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="360" height="280" rx="16" fill="url(#bgGrad2)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#cardShadow2)"/>

  <!-- Hospital Facility Vector -->
  <!-- Main Building Block -->
  <rect x="120" y="80" width="160" height="160" rx="8" fill="url(#bldGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Side Wings -->
  <rect x="65" y="120" width="55" height="120" rx="6" fill="#161622" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="280" y="120" width="55" height="120" rx="6" fill="#161622" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Red Cross Emblem at Top -->
  <circle cx="200" cy="115" r="22" fill="rgba(230, 57, 70, 0.15)" stroke="#e63946" stroke-width="1.5"/>
  <rect x="194" y="103" width="12" height="24" rx="2" fill="#e63946"/>
  <rect x="188" y="109" width="24" height="12" rx="2" fill="#e63946"/>

  <!-- Windows Grid -->
  <!-- Wing Windows -->
  <rect x="80" y="140" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="98" y="140" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="80" y="165" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="98" y="165" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="80" y="190" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="98" y="190" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Right Wing Windows -->
  <rect x="292" y="140" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="310" y="140" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="292" y="165" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="310" y="165" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="292" y="190" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="310" y="190" width="10" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Center Main Windows -->
  <rect x="145" y="150" width="22" height="16" rx="2" fill="rgba(230, 57, 70, 0.25)" stroke="#e63946" stroke-width="0.8"/>
  <rect x="189" y="150" width="22" height="16" rx="2" fill="rgba(230, 57, 70, 0.25)" stroke="#e63946" stroke-width="0.8"/>
  <rect x="233" y="150" width="22" height="16" rx="2" fill="rgba(230, 57, 70, 0.25)" stroke="#e63946" stroke-width="0.8"/>

  <!-- Hospital Main Entrance -->
  <rect x="175" y="195" width="50" height="45" rx="4" fill="#0f0f17" stroke="#e63946" stroke-width="1.2"/>
  <line x1="200" y1="195" x2="200" y2="240" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Ground Line -->
  <line x1="45" y1="240" x2="355" y2="240" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Floating Telemetry Badges -->
  <g transform="translate(45, 52)">
    <rect width="110" height="24" rx="6" fill="#1b1b26" stroke="#10b981" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#10b981"/>
    <text x="26" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Stock: Optimal</text>
  </g>

  <g transform="translate(245, 52)">
    <rect width="110" height="24" rx="6" fill="#1b1b26" stroke="#e63946" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#e63946"/>
    <text x="26" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700">24/7 Depots Live</text>
  </g>

  <!-- Bottom Tag -->
  <rect x="110" y="266" width="180" height="22" rx="11" fill="rgba(230,57,70,0.12)" stroke="rgba(230,57,70,0.3)"/>
  <text x="200" y="281" fill="#ff6b6b" font-family="'Orbitron', monospace" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle">DISTRICT BLOOD DEPOTS</text>
</svg>

