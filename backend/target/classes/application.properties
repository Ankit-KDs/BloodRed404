# ======================================
# RED404 - Blood Donation System
# Spring Boot Application Properties
# ======================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/red404?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root0917
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=RED404_SESSION
server.servlet.session.cookie.http-only=true

# Schema initialization (optional — run schema.sql on startup)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# Logging
logging.level.com.red404=DEBUG
logging.level.org.springframework.web=INFO

